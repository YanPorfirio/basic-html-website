    <main>
        <h1>Get in touch</h1>
        <p>Fill out the form below and I will get back to you as soon as possible.</p>
        <form action="#" method="post">
            <p><label for="name">Name</label><br><input type="text" id="name" name="name" autocomplete="name" required></p>
            <p><label for="email">Email</label><br><input type="email" id="email" name="email" autocomplete="email" required></p>
            <p><label for="subject">Subject</label><br><input type="text" id="subject" name="subject" required></p>
            <p><label for="message">Message</label><br><textarea id="message" name="message" rows="6" required></textarea></p>
            <button type="submit">Send message</button>
        </form>
    </main>
